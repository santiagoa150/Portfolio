<section
  class="relative mx-auto flex max-w-360 flex-col gap-16 px-6 py-16 sm:px-10 lg:min-h-screen lg:flex-row lg:items-center lg:justify-between lg:gap-16 lg:px-16 lg:py-0"
>
  <div class="flex max-w-xl flex-col gap-16">
    <div class="flex flex-col gap-8">
      <h1
        class="text-5xl font-normal uppercase leading-[1.15] text-ink sm:text-6xl lg:text-8xl lg:leading-[1.05]"
      >
        <span i18n="@@home.hero.line1">My name</span><br />
        <span i18n="@@home.hero.line2">is <span class="font-bold">Santiago</span></span><br />
        <span class="font-bold" i18n="@@home.hero.lastName">Álvarez...</span>
      </h1>
      <p
        class="text-xl font-bold italic tracking-tight text-ink sm:text-2xl lg:text-[32px]"
        i18n="@@home.hero.role"
      >
        Software Engineer
      </p>
    </div>

    <app-button routerLink="/contact" i18n="@@home.hero.cta">Let's talk with me</app-button>

    <div class="flex flex-wrap items-center gap-8 sm:gap-12">
      <a [href]="'tel:' + phone" class="flex items-center gap-3 text-lg font-bold italic text-ink">
        <app-icon name="phone" class="size-8 shrink-0" />
        {{ phone }}
      </a>
      <a
        [href]="'mailto:' + email"
        class="flex items-center gap-3 text-lg font-bold italic text-ink"
      >
        <app-icon name="mail" class="size-8 shrink-0" />
        {{ email }}
      </a>
    </div>
  </div>

  <div class="relative mx-auto aspect-1000/1292 w-full max-w-105 shrink-0 lg:mx-0">
    <img
      src="images/hero/blob-2.svg"
      alt=""
      class="pointer-events-none absolute top-20 left-2/8 w-4/5 -translate-x-1/2 -rotate-30"
    />
    <img
      src="images/hero/blob-1.svg"
      alt=""
      class="pointer-events-none absolute bottom-10 -right-30 w-4/5 -rotate-30"
    />
    <div class="relative z-10 h-full w-full">
      <img
        src="images/santiago-hero.png"
        alt="Santiago Álvarez"
        class="h-full w-full object-contain grayscale"
      />
      <div
        aria-hidden="true"
        class="bg-linear-to-br bottom-68 -left-32 rounded-full from-brand-orange via-brand-coral to-brand-purple mix-blend-color absolute inset-0 [clip-path:polygon(100%_-6%,100%_85%,60%_150%,19.5%_88%)]"
      ></div>
      <div
        aria-hidden="true"
        class="bg-linear-to-br rounded-full top-80 -right-25 rotate-150 from-brand-orange via-brand-coral to-brand-purple mix-blend-color absolute inset-0 [clip-path:polygon(-100%_35%,150%_10%,60%_150%,100%_100%)]"
      ></div> 
    </div>
    <img
      src="images/hero/star-1.svg"
      alt=""
      class="pointer-events-none absolute -right-3 top-6 size-7"
    />
    <img
      src="images/hero/star-2.svg"
      alt=""
      class="pointer-events-none absolute -left-3 bottom-14 size-5"
    />
  </div>

  <div class="hidden lg:fixed lg:top-1/3 lg:right-4 lg:z-20 lg:flex lg:flex-col lg:items-center lg:gap-4">
    @for (social of socialLinks; track social.name) {
      <a [href]="social.url" target="_blank" rel="noopener noreferrer" class="size-8">
        <app-icon [name]="social.name" [alt]="social.name" />
      </a>
    }
    <span class="h-24 w-px bg-ink/20"></span>
  </div>
</section>
