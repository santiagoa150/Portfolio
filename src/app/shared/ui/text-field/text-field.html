<div class="flex flex-col gap-2.5">
  <label [for]="id" class="text-base font-medium uppercase text-white opacity-80">
    {{ label() }}
  </label>
  @if (multiline()) {
    <textarea
      [id]="id"
      class="w-full border-b border-white/40 bg-transparent pb-2 text-lg text-white placeholder-white/60 focus:outline-none"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
      rows="2"
    ></textarea>
  } @else {
    <input
      [id]="id"
      [type]="type()"
      class="w-full border-b border-white/40 bg-transparent pb-2 text-lg text-white placeholder-white/60 focus:outline-none"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
    />
  }
</div>
