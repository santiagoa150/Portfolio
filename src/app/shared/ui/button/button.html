<ng-template #label>
  <ng-content />
  @if (showArrow()) {
    <app-icon name="arrow-up-right" class="size-6 shrink-0" />
  }
</ng-template>

@if (routerLink()) {
  <a
    [routerLink]="routerLink()"
    class="inline-flex h-14 items-center justify-center gap-2 px-10 text-lg font-medium"
    [class]="
      variant() === 'primary' ? 'bg-ink text-white' : 'border border-ink text-ink bg-transparent'
    "
  >
    <ng-container *ngTemplateOutlet="label" />
  </a>
} @else if (href()) {
  <a
    [href]="href()"
    [attr.download]="download() ? '' : null"
    class="inline-flex h-14 items-center justify-center gap-2 px-10 text-lg font-medium"
    [class]="
      variant() === 'primary' ? 'bg-ink text-white' : 'border border-ink text-ink bg-transparent'
    "
  >
    <ng-container *ngTemplateOutlet="label" />
  </a>
} @else {
  <button
    [type]="type()"
    class="inline-flex h-14 items-center justify-center gap-2 px-10 text-lg font-medium"
    [class]="
      variant() === 'primary' ? 'bg-ink text-white' : 'border border-ink text-ink bg-transparent'
    "
  >
    <ng-container *ngTemplateOutlet="label" />
  </button>
}
